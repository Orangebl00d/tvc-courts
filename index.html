<title>The Vintage Club Walk</title>
<style>:root{color-scheme:dark;--night:#14181b;--bone:#f6f2ea;--mist:#c9c9c5;--gold:#c8a96a;--edge:clamp(18px, 4vw, 56px);--l:max(var(--edge), env(safe-area-inset-left,0px));--r:max(var(--edge), env(safe-area-inset-right,0px));--top:calc(clamp(16px, 3.2vh, 34px) + env(safe-area-inset-top,0px));--foot:calc(clamp(18px, 3.4vh, 34px) + env(safe-area-inset-bottom,0px));--serif:"Newsreader Variable", "Iowan Old Style", Georgia, serif;--sans:"Helvetica Neue", Helvetica, Arial, sans-serif;--mono:"Space Mono", Menlo, Consolas, monospace}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none;background:#0b0d0f;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;background:0 0;border:0}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}[hidden]{display:none!important}#stage,#stage canvas,.still,#touch,#shade{width:100%;height:100%;position:fixed;inset:0}#stage canvas{display:block}.still{object-fit:cover;opacity:0;pointer-events:none;user-select:none;transition:opacity .7s}.direct .still,.direct #loading{transition:none}#touch{touch-action:none;cursor:grab}#touch.drag{cursor:grabbing}#shade{pointer-events:none;background:linear-gradient(#080a0c94 0%,#080a0c00 18%)}.mono{font-family:var(--mono);letter-spacing:.22em;text-transform:uppercase;font-size:11.5px}.mono.asis,.plain .mono{text-transform:none;letter-spacing:.04em;font-size:12.5px}#top{z-index:6;left:var(--l);right:var(--r);top:var(--top);pointer-events:none;justify-content:space-between;align-items:center;gap:16px;display:flex;position:fixed}.brand{letter-spacing:.16em;white-space:nowrap;align-items:center;gap:10px;font-size:12.5px;display:flex}.brand b{font-weight:700}.brand span{opacity:.8;font-weight:500}.brand i{opacity:.5;background:currentColor;width:1px;height:13px}.brand sup{letter-spacing:0;vertical-align:super;font-size:.55em;line-height:0}#proj{opacity:.86;text-align:right}#draft{border:1px solid var(--gold);color:var(--gold);white-space:nowrap;background:#0c0e108c;padding:6px 12px;display:none}#hint{right:var(--r);top:calc(clamp(52px, 8.5vh, 80px) + env(safe-area-inset-top,0px));color:var(--mist);pointer-events:none;text-align:right;line-height:1.7;transition:opacity .5s;position:fixed}#views{border:1px solid var(--gold);backdrop-filter:blur(8px);pointer-events:auto;background:#0c0e10d1;display:flex;position:absolute;top:calc(100% + 12px);right:0;box-shadow:0 8px 26px #00000061}#views button{color:var(--bone);padding:11px 18px;font-size:12.5px}#views button+button{border-left:1px solid #c8a96a73}#views button:hover{background:#c8a96a33}#views button[aria-current=true]{background:var(--gold);color:#14181b}#views button[data-view=video]:before{content:"";vertical-align:-1px;border-top:5px solid #0000;border-bottom:5px solid #0000;border-left:8px solid;margin-right:9px;display:inline-block}#views.nudge{animation:1.5s ease-out .3s 2 viewsRing}@keyframes viewsRing{0%{box-shadow:0 8px 26px #00000061,0 0 #c8a96abf}to{box-shadow:0 8px 26px #00000061,0 0 0 16px #c8a96a00}}#viewsTip{background:var(--bone);color:#14181b;width:max-content;max-width:min(300px,46vw);font:500 13.5px/1.35 var(--sans);letter-spacing:0;cursor:pointer;padding:10px 14px;display:none;position:absolute;top:50%;right:calc(100% + 16px);transform:translateY(-50%);box-shadow:0 8px 26px #0006}#viewsTip:after{content:"";background:var(--bone);width:10px;height:10px;margin-top:-5px;position:absolute;top:50%;right:-5px;transform:rotate(45deg)}#viewsTip.on{animation:.5s ease-out both tipIn;display:block}@keyframes tipIn{0%{opacity:0;translate:-10px}to{opacity:1;translate:0}}.has-media #hint{top:calc(clamp(52px, 8.5vh, 80px) + 60px + env(safe-area-inset-top,0px))}#media{z-index:5;background:var(--night);padding:calc(var(--top) + 106px) var(--r) var(--foot) var(--l);grid-template-rows:minmax(0,1fr) auto;gap:16px;display:grid;position:fixed;inset:0}#media figure{place-items:center;min-width:0;min-height:0;display:grid;position:relative;container-type:size}#video{object-fit:contain;background:0 0;width:100%;height:100%;position:absolute;inset:0}#gif{width:auto;max-width:100%;height:auto;max-height:100%;margin:auto;position:absolute;inset:0}@supports (width:1cqw){#video{aspect-ratio:16/9;width:min(100cqw,177.778cqh);height:auto;position:static}#gif{max-width:100cqw;max-height:100cqh;margin:0;position:static}}#mediaFoot{border-top:1px solid #ffffff47;justify-content:space-between;align-items:center;gap:16px;padding-top:14px;display:flex}#mediaLabel{color:var(--mist)}#save{border:1px solid #ffffff80;flex:none;padding:9px 14px}#save:disabled{opacity:.6;cursor:default}body[data-view=video] #dock,body[data-view=gif] #dock,body[data-view=video] #hint,body[data-view=gif] #hint{display:none}#dock{left:var(--l);right:var(--r);bottom:var(--foot);pointer-events:none;flex-direction:column;gap:18px;display:flex;position:fixed}#dock:before{content:"";z-index:-1;left:calc(-1 * var(--l));right:calc(-1 * var(--r));top:-130px;bottom:calc(-1 * var(--foot));background:linear-gradient(#080a0c00 0%,#080a0c57 18%,#080a0cbd 45%,#080a0ceb 100%);position:absolute}#capRow{justify-content:space-between;align-items:flex-end;gap:20px;display:flex}#cap{width:min(660px,100%)}#cap .eye{color:var(--mist);align-items:center;gap:12px;margin-bottom:12px;display:flex}#cap .eye i{background:var(--gold);flex:none;width:22px;height:1px;display:block}#cap h1{font-family:var(--serif);letter-spacing:-.012em;text-wrap:balance;font-variant-numeric:lining-nums;font-size:clamp(24px,2.7vw,40px);font-weight:400;line-height:1.12}#cap h1 em{color:var(--gold);font-style:italic}#back{pointer-events:auto;background:#0c0e1099;border:1px solid #ffffff80;flex:none;padding:9px 14px;display:none}#status{text-align:right;max-width:330px;color:var(--mist);flex:none;line-height:1.7}#status:empty{display:none}#credit{letter-spacing:.02em;color:var(--mist);opacity:.66;margin-top:-8px;font-size:10.5px}#bar{pointer-events:auto;border-top:1px solid #ffffff47;flex-wrap:wrap;align-items:center;gap:12px 22px;padding-top:14px;display:flex}#tools{align-items:center;gap:6px;display:flex}#tools button{border:1px solid #fff6;place-items:center;width:38px;height:38px;display:grid}#tools button i{border-top:1.5px solid;border-left:1.5px solid;width:9px;height:9px;display:block}#prev i{transform:translate(2px)rotate(-45deg)}#next i{transform:translate(-2px)rotate(135deg)}#tools #play{width:auto;min-width:150px;padding:0 14px}#stops{flex-wrap:wrap;flex:320px;gap:2px 18px;display:flex}#stops button{color:var(--mist);border-bottom:1px solid #0000;padding:8px 0 6px}#stops button:hover{color:var(--bone)}#stops button[aria-current=true]{color:var(--bone);border-bottom-color:var(--gold)}#wall{border:1px solid #fff6;display:flex}#wall button{color:var(--mist);padding:9px 14px}#wall button[aria-pressed=true]{background:var(--gold);color:#14181b}#loading{z-index:9;padding:0 var(--edge);text-align:center;background:var(--night);font-family:var(--serif);place-items:center;font-size:26px;transition:opacity .6s;display:grid;position:fixed;inset:0}#loading.gone{opacity:0;pointer-events:none}.record #bar,.record #back,.record #hint,.record #credit,.record #status,.record #views,.check #dock,.check #hint,.check #top,.check #shade{display:none!important}.record #dock{bottom:clamp(30px,6vh,64px)}.record #dock:before{bottom:calc(-1*clamp(30px,6vh,64px))}@media (width<=720px){#hint,#proj{display:none}#top{flex-wrap:wrap;justify-content:flex-start;gap:10px 16px}#wall button{padding:9px 10px}#tools #play{min-width:0}#views{position:relative;top:auto;right:auto}#media{padding-top:calc(var(--top) + 142px)}#viewsTip{max-width:min(300px,80vw);top:calc(100% + 12px);left:0;right:auto;transform:none}#viewsTip:after{margin-top:0;top:-5px;left:24px;right:auto}@keyframes tipIn{0%{opacity:0;translate:0 -8px}to{opacity:1;translate:0}}#capRow{flex-direction:column-reverse;align-items:flex-start;gap:12px}#status{text-align:left;max-width:none}}@media (height<=440px){#media{padding-top:calc(var(--top) + 86px);gap:8px}#hint{display:none}#dock{gap:10px}#cap .eye{display:none}#cap h1{font-size:19px}#bar{gap:8px 16px;padding-top:10px}#credit{margin-top:-4px}}@media (height<=330px){#cap{display:none}#capRow{justify-content:flex-end}}@media (prefers-reduced-motion:reduce){#views.nudge,#viewsTip.on{animation:none}.still{transition:none}}</style>

</head>
<body>
<div id="stage"></div>
<img class="still" id="stillGlass" alt="">
<img class="still" id="stillFence" alt="">
<div id="touch"></div>
<div id="shade"></div>
<header id="top"><span class="brand"><b>PICKLETILE<sup>™</sup></b><i id="brandSep"></i><span id="brandProduct"></span></span><span class="mono" id="proj"></span><nav id="views" aria-label="What to look at" hidden><button class="mono" data-view="tour" aria-current="true">Tour</button><button class="mono" data-view="video">Video</button><button class="mono" data-view="gif">GIF</button><p id="viewsTip" role="note"></p></nav></header>
<p class="mono" id="hint">Drag to look around<br>W A S D to walk</p>
<div id="dock">
  <div id="capRow">
    <div id="cap"><p class="eye mono"><i></i><span id="capLabel"></span></p><h1 id="capText"></h1></div>
    <button class="mono" id="back">Back to the picture</button>
    <p class="mono" id="status" role="status"></p>
  </div>
  <div id="bar">
    <div id="tools"><button id="prev" aria-label="Previous stop"><i></i></button><button class="mono" id="play">Play the tour</button><button id="next" aria-label="Next stop"><i></i></button></div>
    <nav id="stops" aria-label="Stops"></nav>
    <div id="wall" role="group" aria-label="Wall"></div>
  </div>
  <p id="credit"></p>
</div>
<section id="media" hidden>
  <figure id="videoView" hidden><video id="video" controls playsinline preload="metadata"></video></figure>
  <figure id="gifView" hidden><img id="gif" alt="A short clip of the tour"></figure>
  <div id="mediaFoot"><p class="mono" id="mediaLabel"></p><button class="mono" id="save">Save the video</button></div>
</section>
<div id="loading">Building the site</div>
</body>
</html>
